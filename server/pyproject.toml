[project]
name = "baghchal-server"
version = "0.1.0"
description = "Bagh Chal platform backend"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncmy>=0.2.10",
    "baghchal-engine",
    "cryptography>=43",  # asyncmy needs it for MySQL 8 caching_sha2_password auth
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",  # Razorpay's API
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sentry-sdk[fastapi]>=2.19",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
baghchal-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baghchal_server"]
