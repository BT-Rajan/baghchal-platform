name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --config-file ../pyproject.toml .
        working-directory: engine
      - run: uv run mypy --config-file ../pyproject.toml .
        working-directory: server

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest engine --cov=baghchal_engine --cov-branch --cov-fail-under=100

  server:
    # Every test runs twice: on SQLite and on a real MySQL-family server. Coverage is
    # combined across both runs and must reach 100%.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mariadb:11.4"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: baghchal_test
          MYSQL_USER: baghchal
          MYSQL_PASSWORD: baghchal
        ports: ["3306:3306"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      BAGHCHAL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked
      - name: Tests on SQLite
        run: uv run pytest server --cov=baghchal_server --cov-branch
      - name: Wait for the database
        run: |
          for i in $(seq 60); do
            uv run python -c "import socket; socket.create_connection(('127.0.0.1', 3306), 1)" \
              2>/dev/null && sleep 5 && exit 0
            sleep 2
          done
          exit 1
      - name: Tests on ${{ matrix.db }}
        env:
          BAGHCHAL_TEST_DATABASE_URL: mysql+asyncmy://baghchal:baghchal@127.0.0.1/baghchal_test
        run: >-
          uv run pytest server --cov=baghchal_server --cov-branch --cov-append
          --cov-report=term-missing --cov-fail-under=100

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run guardrails
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run export:web
