name: Android test build

# An APK for testing on phones, built here rather than in Expo's cloud (docs/adr/0002). It is
# signed with the debug key, so it installs from the file but cannot go to Google Play.
# Links to the website open the app only when the website is on https (app.config.ts), and only
# once the website lists this key's fingerprint (BAGHCHAL_ANDROID_CERT_SHA256, docs/operations.md).
# Run it by hand (Actions → Android test build → Run workflow), or push to a branch
# android-test-build or android-test/*.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "The server the app talks to (https, or http for a test server)"
        required: true
        default: "http://169.58.13.213:7070"
  push:
    branches: ["android-test-build", "android-test/**"]

permissions:
  # Write: the main line's APK is published to the "android-test" release (the download page).
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: "1"
      # A push has no inputs: it builds for the default test server.
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'http://169.58.13.213:7070' }}
      NODE_ENV: production
      # Each build a higher version code, so a new APK installs over the last one.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow plain http only when the address asks for it
        run: |
          case "$EXPO_PUBLIC_API_URL" in
            http://*) echo "EXPO_PUBLIC_ALLOW_PLAIN_HTTP=true" >> "$GITHUB_ENV" ;;
            https://*) ;;
            *) echo "api_url must start with https:// or http://" >&2; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run guardrails
      # The bundle must not use Intl that the phone's engine lacks (it would crash there only).
      - name: Check the JavaScript against Hermes
        run: |
          npx expo export --platform android --no-bytecode --output-dir "$RUNNER_TEMP/bundle"
          node scripts/check-hermes-bundle.mjs "$RUNNER_TEMP/bundle"
      - run: npx expo prebuild --platform android --no-install --clean
      # 64-bit and 32-bit ARM: the phones of the last decade.
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: clawplay-test-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
      # The main line's build is also the one the download page offers (/download in the app):
      # one fixed release, its file replaced each time, so the link never changes.
      - name: Publish as the latest test APK
        if: github.ref == 'refs/heads/android-test-build'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: >-
            The latest ClawPlay test build for Android (build ${{ github.run_number }},
            commit ${{ github.sha }}). Signed with the debug key: it installs from the file,
            not from Google Play.
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk clawplay.apk
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --prerelease --target "$GITHUB_SHA" \
              --title "ClawPlay test APK" --notes "$NOTES"
          fi
          gh release upload android-test clawplay.apk --clobber
          gh release edit android-test --notes "$NOTES"
