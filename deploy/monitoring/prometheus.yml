# Scrapes every API replica (found through Docker's DNS for "api") and evaluates alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: baghchal-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 30s
