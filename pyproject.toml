[project]
name = "baghchal-platform"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
baghchal-engine = { workspace = true }

[dependency-groups]
dev = [
    "baghchal-engine",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "S", "C4", "PERF", "N"]
ignore = [
    "PLR2004",  # magic numbers: board constants read better inline in tests
    "N818",     # exception names follow the domain (IllegalMove, GameOver)
]

[tool.ruff.lint.isort]
known-first-party = ["baghchal_engine"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311", "PLR0913"]
"**/benchmarks/**" = ["S311", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
